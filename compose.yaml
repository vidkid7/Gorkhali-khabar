x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-Gorkhali Khabar}
  APP_ENV: ${APP_ENV:-local}
  APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:8080}
  ADMIN_PATH: ${ADMIN_PATH:-gorkhali-admin}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-gorkhali}
  DB_USERNAME: ${POSTGRES_USER:-gorkhali}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-gorkhali_dev}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  SESSION_DRIVER: redis
  SESSION_COOKIE: ${SESSION_COOKIE:-gorkhali_session}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-news@example.test}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Gorkhali Khabar}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  environment: *backend-environment
  volumes:
    - uploads:/var/www/html/storage/app/public
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      DATABASE_URL: postgresql://gorkhali:gorkhali_dev@postgres:5432/gorkhali
      API_INTERNAL_URL: http://web
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    <<: *backend-service
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend-service
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=90
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *backend-service
    command: php artisan schedule:work
    depends_on:
      backend:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - uploads:/var/www/html/storage/app/public:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gorkhali}
      POSTGRES_USER: ${POSTGRES_USER:-gorkhali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gorkhali_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  uploads: