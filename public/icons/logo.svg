<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
    <defs>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#4a90e2"/>
            <stop offset="50%" style="stop-color:#1a4fa0"/>
            <stop offset="100%" style="stop-color:#0a3a8c"/>
        </linearGradient>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#ff3a3a"/>
            <stop offset="50%" style="stop-color:#c41e1e"/>
            <stop offset="100%" style="stop-color:#8b0a0a"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="1" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- "Gorkhali" in blue gradient -->
    <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="120" filter="url(#shadow)">
        <text x="20" y="125" fill="url(#blueGrad)" letter-spacing="-2">Gorkhali</text>
    </g>

    <!-- "Khabar" in red gradient -->
    <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="120" filter="url(#shadow)">
        <text x="430" y="125" fill="url(#redGrad)" letter-spacing="-2">Khabar</text>
    </g>

    <!-- Black accent rectangles behind letters (decorative) -->
    <rect x="20" y="135" width="40" height="40" fill="#0a0a0a" opacity="0.55"/>
    <rect x="240" y="135" width="40" height="40" fill="#0a0a0a" opacity="0.55"/>
    <rect x="430" y="135" width="40" height="40" fill="#0a0a0a" opacity="0.55"/>
    <rect x="650" y="135" width="40" height="40" fill="#0a0a0a" opacity="0.55"/>

    <!-- Decorative bottom bars -->
    <rect x="20" y="178" width="380" height="6" fill="#c41e1e"/>
    <rect x="420" y="178" width="380" height="6" fill="#1a4fa0"/>
</svg>
